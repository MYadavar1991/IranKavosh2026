<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>کلوپ ایران کاوش</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f3f8;--surface:#ffffff;--text:#12141d;--muted:#555c73;--line:rgba(18,20,29,.14);
  --accent:#e08600;--accent-ink:#ffffff;--teal:#0b8f84;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0a0c12;--surface:#171b28;--text:#f4f5f9;--muted:#a3aabf;--line:rgba(255,255,255,.14);--accent:#ffb020;--accent-ink:#1a1100;--teal:#3dd6c6}
}
:root[data-theme="dark"]{--bg:#0a0c12;--surface:#171b28;--text:#f4f5f9;--muted:#a3aabf;--line:rgba(255,255,255,.14);--accent:#ffb020;--accent-ink:#1a1100;--teal:#3dd6c6}
*{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;line-height:1.7;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.pad{padding-inline:clamp(14px,4vw,48px)}

.hero{position:relative;height:100%;min-height:540px;display:flex;align-items:flex-end;overflow:hidden;isolation:isolate;touch-action:pan-y}
.bgs{position:absolute;inset:0;z-index:-2;background:var(--bg)}
.bg{position:absolute;inset:0;opacity:0;transition:opacity .9s ease}
.bg.on{opacity:1}
.bg svg{width:100%;height:100%;display:block}
.bg img{width:100%;height:100%;object-fit:cover;display:block;filter:blur(30px) saturate(1.25) brightness(.72);transform:scale(1.3)}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(to top,var(--bg) 4%,color-mix(in srgb,var(--bg) 45%,transparent) 52%,color-mix(in srgb,var(--bg) 22%,transparent)),
             linear-gradient(to left,color-mix(in srgb,var(--bg) 90%,transparent) 6%,transparent 72%)}

/* top bar */
.top{position:absolute;top:0;inset-inline:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);z-index:5}
.top .in{display:flex;align-items:center;gap:12px;height:54px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;white-space:nowrap}
.logo{width:36px;height:36px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:900;transform:rotate(-6deg)}
.grow{flex:1}
.cnt{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(8px);transition:background .2s}
.ib:hover{background:color-mix(in srgb,var(--text) 18%,transparent)}
.ib svg,.nv svg,.btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* content */
.hin{width:100%;display:grid;grid-template-columns:minmax(0,1fr) clamp(104px,29vw,150px);gap:14px;padding-top:96px;padding-bottom:168px;align-items:end}
@media(min-width:720px){.hin{padding-bottom:206px;gap:22px}}
@media(min-width:900px){.hin{grid-template-columns:minmax(0,1fr) 280px;gap:26px}}
.hc{max-width:660px}
.swap{animation:rise .55s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.kick{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;border-radius:7px;padding:1px 10px;font-size:12px;font-weight:800;background:var(--accent);color:var(--accent-ink)}
.pill.ani{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.pill.teal{background:color-mix(in srgb,var(--teal) 22%,transparent);color:var(--teal);border:1px solid color-mix(in srgb,var(--teal) 50%,transparent)}
.pill.ghost{background:color-mix(in srgb,var(--text) 14%,transparent);color:var(--text);font-weight:600}
.ht{font-size:clamp(25px,7vw,74px);font-weight:900;line-height:1.15;margin:0 0 12px;letter-spacing:-.02em;text-wrap:balance}
.hm{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);margin-bottom:12px}
.rate{display:inline-flex;gap:5px;align-items:center;color:var(--accent);font-weight:800}
.rate svg{width:15px;height:15px;fill:currentColor;stroke:none}
.hs{margin:0 0 22px;font-size:clamp(14px,1.7vw,16px);max-width:58ch;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
@media(min-width:720px){.hs{-webkit-line-clamp:3}}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:12px;padding:11px 24px;font-weight:800;font-size:15px;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--accent);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(1.08)}
.btn.s{background:color-mix(in srgb,var(--text) 16%,transparent);backdrop-filter:blur(8px)}
.btn.s:hover{background:color-mix(in srgb,var(--text) 26%,transparent)}
.hpost{display:block;cursor:pointer;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(2deg);aspect-ratio:2/3;border:1px solid var(--line);position:relative;background:var(--surface)}
@media(min-width:900px){.hpost{border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.5)}}
.hpost svg,.hpost img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* arrows */
.nv{position:absolute;top:50%;z-index:5;width:48px;height:48px;margin-top:-24px;border-radius:50%;display:none;place-items:center;background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(8px);opacity:0;transition:opacity .25s,background .2s}
.nv:hover{background:color-mix(in srgb,var(--text) 22%,transparent)}
.nv.prev{inset-inline-start:16px}.nv.next{inset-inline-end:16px}
@media(hover:hover) and (min-width:900px){.nv{display:grid}.hero:hover .nv{opacity:1}}

/* thumbs */
.strip{position:absolute;inset-inline:0;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:4;display:flex;align-items:flex-end;gap:10px;overflow-x:auto;scrollbar-width:none;padding-top:8px;padding-bottom:4px}
.strip::-webkit-scrollbar{display:none}
.th{position:relative;flex:0 0 auto;width:66px;height:99px;border-radius:10px;overflow:hidden;opacity:.62;transition:opacity .25s,transform .25s,border-color .25s;border:1px solid var(--line);background:var(--surface)}
@media(min-width:720px){.th{width:86px;height:129px}}
.th:hover{opacity:.95}
.th[aria-current="true"]{opacity:1;transform:translateY(-5px);border-color:var(--accent);border-width:2px}
.th svg,.th img{width:100%;height:100%;display:block;object-fit:cover}
.th span{position:absolute;inset:auto 0 0;padding:18px 5px 5px;font-size:10px;line-height:1.35;font-weight:800;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.85));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-align:center}
@media(min-width:720px){.th span{font-size:11px;padding:20px 6px 6px}}
.th i{position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--accent);transform-origin:right;transform:scaleX(0)}
.th[aria-current="true"] i{animation:prog var(--d,6.5s) linear forwards}
@keyframes prog{to{transform:scaleX(1)}}

.msg{position:fixed;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.msg b{display:block;color:var(--text);font-size:20px;margin-bottom:4px}

/* modal */
dialog{border:0;padding:0;max-width:820px;width:calc(100% - 20px);max-height:calc(100dvh - 28px);border-radius:22px;background:var(--surface);color:var(--text);box-shadow:0 40px 100px rgba(0,0,0,.65);overflow:auto}
dialog::backdrop{background:rgba(3,5,10,.74);backdrop-filter:blur(5px)}
dialog[open]{animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}}
.mh{position:relative;height:clamp(140px,26vw,210px);overflow:hidden}
.mh svg,.mh img{width:100%;height:100%;display:block;object-fit:cover}
.mh img{filter:blur(26px) saturate(1.2) brightness(.7);transform:scale(1.3)}
.mh::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--surface),transparent 70%)}
.x{position:absolute;top:12px;inset-inline-end:12px;z-index:3;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center}
.x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.mb{padding:0 clamp(18px,4vw,34px) 28px;margin-top:-86px;position:relative;z-index:2}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) clamp(104px,26vw,170px);gap:16px;align-items:end}
.mp{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.5);border:1px solid var(--line);background:var(--surface)}
.mp img,.mp svg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mb h2{margin:0 0 8px;font-size:clamp(22px,4.4vw,38px);font-weight:900;line-height:1.2}
.mcols{display:grid;gap:22px;grid-template-columns:1fr;margin-top:18px}
@media(min-width:680px){.mcols{grid-template-columns:1fr 230px}}
.mcols p{margin:0;font-size:15px;line-height:1.95}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;align-content:start}
dt{color:var(--muted)}dd{margin:0;font-weight:600}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}.th i{display:none}}
</style>
</head>
<body>
<div id="app"><div class="msg"><span>در حال بارگذاری...</span></div></div>
<dialog id="dlg" aria-label="جزئیات فیلم"></dialog>

<script>
/* ---------- تنظیمات ---------- */
const AUTO_MS = 6500;      // زمان نمایش هر فیلم (میلی‌ثانیه)
const ALLOW_DEMO = true;   // برای نسخه‌ی نهایی false بگذار تا بدون ?p= پیام «لینک نامعتبر» نشان دهد

/* ---------- داده‌ی نمونه (فقط وقتی ?p= در لینک نیست) ---------- */
const DEMO={title:"فیلم‌های جدید این هفته",date:"۹ مهر ۱۴۰۵",items:[
 {name:"ردپای خاموش",year:2025,genre:["جنایی","درام"],country:"us",type:"سینمایی",rate:8.1,dur:"۱۲۸ دقیقه",cast:"سامان رادمنش، نگار فرخی",sum:"کارآگاهی بازنشسته با یک پرونده‌ی نیمه‌تمام روبه‌رو می‌شود که او را به شهری می‌کشاند که سال‌ها از آن گریخته بود. هر سرنخ، یک راز قدیمی‌تر را باز می‌کند."},
 {name:"آخرین پرواز بی‌صدا",year:2025,genre:["علمی‌تخیلی","ماجراجویی","درام"],country:"kr",type:"سینمایی",rate:7.6,dur:"۱۴۲ دقیقه",cast:"کیان مهرجو، آوا صبوری",sum:"خدمه‌ی یک ایستگاه فضایی کوچک بعد از قطع ارتباط با زمین باید تصمیم بگیرند که بمانند یا برگردند. زمان کم است و اکسیژن کمتر."},
 {name:"خانه‌ای بالای مه",year:2024,genre:["ترسناک","معمایی"],country:"gb",type:"سینمایی",rate:6.9,dur:"۹۶ دقیقه",cast:"مهسا کلانتری، رضا نوبخت",sum:"خانواده‌ای برای تعطیلات به کلبه‌ای دورافتاده در کوهستان می‌روند و شب اول متوجه می‌شوند تنها مهمان خانه نیستند."},
 {name:"فصل کوچ",year:2025,genre:"درام",country:"ir",type:"سریال",rate:8.4,dur:"۱۱۵ دقیقه",cast:"هادی بهزادی، ترانه شمس",sum:"داستان یک خانواده‌ی عشایری در آخرین سال کوچ سنتی‌شان؛ جایی که نسل جدید باید میان ماندن و رفتن یکی را انتخاب کند."},
 {name:"دو دقیقه تا ظهر",year:2023,genre:["اکشن","هیجان‌انگیز"],country:"in",type:"سینمایی",rate:7.2,dur:"۱۰۸ دقیقه",cast:"بهرام ایزدی، الهام کسرایی",sum:"یک مأمور امنیتی ساده در یک روز عادی تنها کسی است که می‌تواند جلوی نقشه‌ای حساب‌شده در قلب شهر را بگیرد."},
 {name:"شب‌های رنگی",year:2024,genre:["کمدی","موزیکال"],country:"it",type:"سینمایی",rate:7.0,dur:"۱۰۲ دقیقه",cast:"فرهاد پاکزاد، سحر دانایی",sum:"سه دوست قدیمی برای نجات سینمای محله‌شان دست به کاری می‌زنند که هیچ‌کدام تصورش را هم نمی‌کردند."},
 {name:"مرز سرخ",year:2025,genre:["جنایی","اکشن"],country:"us",type:"سینمایی",rate:7.8,dur:"۱۳۱ دقیقه",cast:"داریوش فلاحی، پرستو نجفی",sum:"قاچاقچی‌ای که می‌خواهد کنار بکشد، آخرین محموله را از مرزی می‌گذراند که هیچ‌کس تا حالا سالم برنگشته."},
 {name:"باغ آبی",year:2022,genre:["انیمیشن","خانوادگی"],country:"jp",type:"سینمایی",isAnimated:true,rate:8.0,dur:"۹۱ دقیقه",cast:"صداپیشگان گروه نوا",sum:"دختری کوچک در باغی پشت خانه‌ی مادربزرگ دری پیدا می‌کند که به دنیایی از رنگ‌های گمشده باز می‌شود."},
 {name:"ستاره‌های کوچک",year:2024,genre:["انیمه","ماجراجویی"],country:"jp",type:"سریال",isAnime:true,rate:8.2,dur:"۲۴ قسمت",cast:"صداپیشگان استودیو هوشی",sum:"گروهی از نوجوانان در شهری شناور بالای ابرها برای پیدا کردن آخرین ستاره‌ی خاموش‌شده سفر می‌کنند."}
]};

/* ---------- کشور سازنده ----------
   فقط کشورهای این لیست نمایش داده می‌شوند. هر کشوری که اینجا نباشد (مثل انگلیس یا ایتالیا) نمایش داده نمی‌شود.
   برای اضافه‌کردن کشور جدید یک خط بنویس:  کد: ["عنوان فارسی", "نام‌های دیگر (حروف کوچک)"...]  */
const COUNTRIES={
  us:["آمریکایی","usa","united states","آمریکا"],
  in:["هندی","india","هند"],
  ir:["ایرانی","iran","ایران"],
  kr:["کره‌ای","korea","south korea","کره","کره جنوبی"],
  jp:["ژاپنی","japan","ژاپن"],
  tr:["ترکیه‌ای","turkey","turkiye","ترکیه","ترکی"],
  cn:["چینی","china","چین"]
};
const COUNTRY_LOOKUP={};
Object.entries(COUNTRIES).forEach(([k,v])=>{COUNTRY_LOOKUP[k]=v[0];v.forEach(n=>COUNTRY_LOOKUP[n.toLowerCase()]=v[0])});
const countryLabel=c=>has(c)?(COUNTRY_LOOKUP[String(c).trim().toLowerCase()]||''):'';

/* ---------- ابزارها ---------- */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fa=n=>String(n).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const fr=r=>fa(Number(r).toFixed(1)).replace('.','٫');
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const has=v=>v!==undefined&&v!==null&&String(v).trim()!=="";
const STAR='<svg viewBox="0 0 24 24"><path d="M12 2l3 6.9 7.5.7-5.7 5 1.7 7.4L12 18l-6.5 4 1.7-7.4-5.7-5 7.5-.7z"/></svg>';
const ICON={
  info:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>',
  l:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  r:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  moon:'<svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* پوستر ساختگی (فقط وقتی فیلم poster ندارد) */
let uid=0;
function art(m,wide){
  const a=m.h[0],b=m.h[1],id='g'+(uid++),c1=`hsl(${a} 72% 40%)`,c2=`hsl(${b} 78% 12%)`,c3=`hsl(${a} 92% 72%)`;
  if(wide){
    const mo=[
     `<circle cx="470" cy="120" r="90" fill="${c3}" opacity=".8"/><path d="M0 300 L120 170 L210 250 L330 130 L450 240 L600 150 V300Z" fill="#000" opacity=".5"/>`,
     `<circle cx="460" cy="140" r="120" fill="none" stroke="${c3}" stroke-width="4" opacity=".7"/><circle cx="460" cy="140" r="70" fill="${c3}" opacity=".5"/><path d="M0 230 Q300 150 600 240" stroke="#fff" stroke-width="2" fill="none" opacity=".5"/>`,
     `<path d="M0 300 V210 H60 V160 H110 V220 H180 V120 H250 V200 H330 V150 H400 V230 H470 V170 H600 V300Z" fill="#000" opacity=".55"/><circle cx="440" cy="80" r="42" fill="${c3}" opacity=".9"/>`,
     `<path d="M0 60 L600 0 V80 L0 140Z" fill="${c3}" opacity=".35"/><path d="M0 170 L600 110 V190 L0 250Z" fill="${c3}" opacity=".2"/><circle cx="130" cy="230" r="34" fill="#fff" opacity=".45"/>`][m.m];
    return `<svg viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="600" height="300" fill="url(#${id})"/>${mo}</svg>`;
  }
  const mo=[
   `<circle cx="100" cy="95" r="46" fill="${c3}" opacity=".85"/><path d="M0 230 L70 150 L120 200 L170 140 L200 190 V300 H0Z" fill="#000" opacity=".45"/>`,
   `<circle cx="100" cy="110" r="60" fill="none" stroke="${c3}" stroke-width="3" opacity=".8"/><circle cx="100" cy="110" r="38" fill="${c3}" opacity=".5"/><path d="M-10 200 Q100 150 210 200" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/>`,
   `<path d="M0 300 V190 H40 V150 H70 V210 H110 V120 H150 V180 H200 V300Z" fill="#000" opacity=".5"/><circle cx="150" cy="70" r="26" fill="${c3}" opacity=".9"/>`,
   `<path d="M-20 60 L220 20 L220 80 L-20 120Z" fill="${c3}" opacity=".35"/><path d="M-20 140 L220 100 L220 160 L-20 200Z" fill="${c3}" opacity=".2"/><circle cx="60" cy="210" r="20" fill="#fff" opacity=".5"/>`][m.m];
  return `<svg viewBox="0 0 200 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2=".7" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="200" height="300" fill="url(#${id})"/>${mo}</svg>`;
}
const posterEl=m=>m.poster?`<img src="${esc(m.poster)}" alt="" decoding="async">`:art(m,false);
const backEl=m=>m.poster?`<img src="${esc(m.poster)}" alt="" decoding="async">`:art(m,true);

/* ---------- وضعیت ---------- */
let ITEMS=[],TITLE="",DATE="",cur=0,timer=null,reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

const durLabel=d=>!has(d)?'':(/^\d+$/.test(String(d).trim())?fa(String(d).trim())+' دقیقه':String(d));
function metaLine(m){
  return `${has(m.rate)?`<span class="rate">${STAR}${fr(m.rate)}</span>`:''}${has(m.year)?`<span>${fa(m.year)}</span>`:''}${m.genres.length?`<span>${m.genres.map(esc).join('، ')}</span>`:''}${has(m.dur)?`<span>${esc(durLabel(m.dur))}</span>`:''}`;
}
function animLabel(m){
  const kind=m.isAnime?'انیمه':(m.isAnimated?'انیمیشن':'');
  const t=has(m.type)?String(m.type).trim():'';
  return esc(`${kind} ${t}`.trim());
}
const listText=t=>String(t??'').split(/[,،]/).map(x=>x.trim()).filter(Boolean).join('، ');
function pills(m){
  const c=countryLabel(m.country),an=animLabel(m);
  return `${an?`<span class="pill ani">${an}</span>`:''}${c?`<span class="pill">${c}</span>`:''}<span class="pill teal">دوبله فارسی</span>`;
}
function content(m){
  return `<div class="kick">${pills(m)}</div>
  <h1 class="ht">${esc(m.name)}</h1>
  <div class="hm">${metaLine(m)}</div>
  ${has(m.sum)?`<p class="hs">${esc(m.sum)}</p>`:''}
  <div class="acts"><button class="btn p" data-open>${ICON.info}اطلاعات کامل</button></div>`;
}

function build(){
  const many=ITEMS.length>1;
  $('#app').innerHTML=`<section class="hero" id="hero" aria-roledescription="carousel" aria-label="فیلم‌های جدید">
    <div class="bgs">${ITEMS.map((m,i)=>`<div class="bg${i===0?' on':''}" data-b="${i}">${backEl(m)}</div>`).join('')}</div>
    <div class="top"><div class="pad in"><div class="brand"><div class="logo">ک</div><span>ایران کاوش</span></div><span class="grow"></span>
      <span class="cnt" id="cnt"></span>
      <button class="ib" id="theme" aria-label="تغییر حالت روشن و تاریک">${ICON.moon}</button></div></div>
    ${many?`<button class="nv prev" id="prev" aria-label="فیلم قبلی">${ICON.r}</button><button class="nv next" id="next" aria-label="فیلم بعدی">${ICON.l}</button>`:''}
    <div class="pad hin"><div class="hc swap" id="hc"></div><div class="hpost swap" id="hp" data-open></div></div>
    ${many?`<div class="pad strip" id="strip" role="tablist" aria-label="انتخاب فیلم">${ITEMS.map((m,i)=>`<button class="th" role="tab" data-t="${i}" aria-label="${esc(m.name)}">${m.poster?`<img src="${esc(m.poster)}" alt="" loading="lazy">`:art(m,false)}<span>${esc(m.name)}</span><i></i></button>`).join('')}</div>`:''}
  </section>`;
  $('#hero').style.setProperty('--d',AUTO_MS+'ms');
  $$('.th').forEach(t=>t.style.setProperty('--d',AUTO_MS+'ms'));
  show(0,true);
  bind();
}

function show(i,first){
  cur=(i+ITEMS.length)%ITEMS.length;
  const m=ITEMS[cur];
  $$('.bg').forEach(b=>b.classList.toggle('on',+b.dataset.b===cur));
  const hc=$('#hc'),hp=$('#hp');
  hc.innerHTML=content(m);hp.innerHTML=posterEl(m);
  [hc,hp].forEach(e=>{e.classList.remove('swap');void e.offsetWidth;e.classList.add('swap')});
  $('#cnt').textContent=`${fa(cur+1)} از ${fa(ITEMS.length)}`;
  $$('.th').forEach((t,j)=>{t.removeAttribute('aria-current');t.setAttribute('aria-selected',j===cur);if(j===cur)t.setAttribute('aria-current','true')});
  const act=$('.th[aria-current="true"]');
  if(act&&!first)act.scrollIntoView({inline:'center',block:'nearest',behavior:reduce?'auto':'smooth'});
  start();
}
/* نوار زمان زیر بندانگشتی فقط وقتی دیده می‌شود که تایمر واقعاً در حال کار است */
function bar(){return document.querySelector('.th[aria-current="true"] i')}
function start(){
  stop();
  if(reduce||ITEMS.length<2||document.hidden||dlg.open)return;
  const b=bar();if(b){b.style.animation='none';void b.offsetWidth;b.style.animation=''}
  timer=setTimeout(()=>show(cur+1),AUTO_MS);
}
function stop(){
  clearTimeout(timer);
  const b=bar();if(b)b.style.animation='none';
}

function bind(){
  const hero=$('#hero');
  hero.addEventListener('click',e=>{
    const t=e.target.closest('[data-t]');if(t)return show(+t.dataset.t);
    if(e.target.closest('[data-open]'))return openM(cur);
    if(e.target.closest('#prev'))return show(cur-1);
    if(e.target.closest('#next'))return show(cur+1);
  });
  $('#theme').onclick=()=>{const r=document.documentElement,c=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');r.dataset.theme=c==='dark'?'light':'dark'};
  /* سوایپ در موبایل */
  let sx=null,sy=0;
  hero.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;stop()},{passive:true});
  hero.addEventListener('touchend',e=>{
    if(sx!==null){const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4){show(dx>0?cur+1:cur-1);sx=null;return}}
    sx=null;start()},{passive:true});
}
document.addEventListener('visibilitychange',()=>document.hidden?stop():start());
addEventListener('keydown',e=>{if(dlg.open||!ITEMS.length)return;
  if(e.key==='ArrowLeft')show(cur+1);else if(e.key==='ArrowRight')show(cur-1)});

/* ---------- جزئیات ---------- */
const dlg=$('#dlg');
function openM(i){
  const m=ITEMS[i];stop();
  const rows=[['نوع',animLabel(m)],['ژانر',m.genres.join('، ')],['کشور سازنده',countryLabel(m.country)],['بازیگران',listText(m.cast)],['سال',has(m.year)?fa(m.year):''],['مدت',durLabel(m.dur)]].filter(r=>has(r[1]));
  dlg.innerHTML=`<div class="mh">${backEl(m)}<button class="x" id="cx" aria-label="بستن">${ICON.x}</button></div>
  <div class="mb"><div class="mrow"><div><div class="kick">${pills(m)}</div><h2>${esc(m.name)}</h2><div class="hm">${metaLine(m)}</div></div><div class="mp">${posterEl(m)}</div></div>
  <div class="mcols">${has(m.sum)?`<p>${esc(m.sum)}</p>`:'<span></span>'}<dl>${rows.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></div>
  </div>`;
  dlg.showModal();$('#cx').onclick=()=>dlg.close();
}
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
dlg.addEventListener('close',start);

/* ---------- بارگذاری ---------- */
function msg(b,t){$('#app').innerHTML=`<div class="msg"><div><b>${b}</b>${t||''}</div></div>`}
function init(data,base){
  TITLE=data.title||'';DATE=data.date||'';
  if(TITLE)document.title=TITLE+' | ایران کاوش';
  ITEMS=(data.items||[]).map((m,i)=>({...m,i,genres:[].concat(m.genre??[]).flatMap(g=>String(g).split(/[,،|]/)).map(g=>g.trim()).filter(Boolean),h:[(i*53+210)%360,(i*53+270)%360],m:i%4,poster:m.poster?base+encodeURI(m.poster):''}));
  if(!ITEMS.length)return msg('فیلمی برای نمایش نیست');
  build();
}
(function(){
  const p=new URLSearchParams(location.search).get('p');
  if(p&&/^[A-Za-z0-9_-]+$/.test(p)){
    fetch(p+'/data.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>init(d,p+'/')).catch(()=>msg('این پست پیدا نشد','لینک را بررسی کنید.'));
  }else if(ALLOW_DEMO){init(DEMO,'')}
  else msg('لینک نامعتبر است','آدرس کامل پست را باز کنید.');
})();
</script>
</body>
</html>
